name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # npm cache is keyed on package-lock.json only; restored on every
          # run and only replaced when dependency versions change.
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Restore Next.js cache
        id: nextjs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/cache
          # Exact key = dependency versions only. Content-only deploys keep
          # hitting this cache. A new package-lock (or next config) is a miss.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build with Next.js
        run: npm run build

      # actions/cache does not overwrite an existing exact key. Only save when
      # this version of the deps has no cache yet (first build or lockfile change).
      - name: Save Next.js cache
        if: steps.nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.mjs') }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
